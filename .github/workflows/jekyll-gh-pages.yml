# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Lumii Quest to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages content
        run: |
          mkdir -p _site/downloads
          cp index.html 404.html _site/
          cp -R app _site/app
          mapfile -t apk_paths < <(grep -oE 'href="downloads/[^"]+\.apk"' index.html | cut -d '"' -f 2)
          if ((${#apk_paths[@]} == 0)); then
            echo "No APK download links found in index.html" >&2
            exit 1
          fi
          for apk_path in "${apk_paths[@]}"; do
            if [[ ! -f "$apk_path" ]]; then
              echo "Linked APK not found: $apk_path" >&2
              exit 1
            fi
            cp "$apk_path" "_site/$apk_path"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
