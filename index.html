      --primary: #000000;
      --primary-press: #262626;

    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.9rem);
      line-height: 1.1;
      text-align: center;
    }

    p {
      margin: 0 auto;
      max-width: 46ch;
      color: var(--muted);
      line-height: 1.6;
    }

    .download-grid {
      margin-top: 28px;
      display: grid;
      grid-template-columns: minmax(0, 280px);
      justify-content: center;
      gap: 12px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border-radius: 12px;
      padding: 14px 18px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .cta svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .cta:hover {
      background: var(--primary-press);
      transform: translateY(-1px);
    }

    .cta:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .panel {
      margin-top: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-align: left;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--ink);
    }

    .facts {
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.95rem;
      display: grid;
      gap: 8px;
    }

    .facts strong {
      color: var(--ink);
      font-weight: 600;
    }

    @media (max-width: 520px) {
      .download-grid {
        grid-template-columns: 1fr;

    }
